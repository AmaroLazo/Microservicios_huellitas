

server.port=8091
spring.cloud.openfeign.client.config.codigoms-orders.defaultRequestHeaders.X-Huellitas-Internal=${HUELLITAS_INTERNAL_KEY:}
spring.application.name=codigoms-pagos

spring.datasource.url=jdbc:mysql://localhost:3306/pagos_db?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# URL del microservicio de ordenes
orders.service.url=http://localhost:8084


spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000
