# Crear BD "pedidos_db" en phpMyAdmin antes de arrancar.

server.port=8084
spring.application.name=codigoms-pedidos

spring.datasource.url=jdbc:mysql://localhost:3306/pedidos_db?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# URL del catálogo utilizada por el cliente Feign de pedidos
catalog.service.url=http://localhost:8082
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000
app.seed.demo.enabled=true
spring.cloud.openfeign.client.config.codigoms-catalogo.defaultRequestHeaders.X-Huellitas-Internal=${HUELLITAS_INTERNAL_KEY:}
